<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Legal AI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* --- iOS 17 STYLE VARIABLES --- */
        :root {
            --tg-bg: var(--tg-theme-bg-color, #ffffff);
            --tg-sec-bg: var(--tg-theme-secondary-bg-color, #f2f2f7);
            --tg-text: var(--tg-theme-text-color, #000000);
            --tg-hint: var(--tg-theme-hint-color, #8e8e93);
            --tg-btn: var(--tg-theme-button-color, #007aff);
            --tg-btn-text: var(--tg-theme-button-text-color, #ffffff);
            
            --radius-card: 16px;
            --radius-input: 12px;
            
            --pro-gradient: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            --shadow: 0 4px 20px rgba(0,0,0,0.05);
            --error-color: #ff3b30;
        }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, Arial, sans-serif;
            background-color: var(--tg-sec-bg);
            color: var(--tg-text);
            -webkit-tap-highlight-color: transparent;
            padding-bottom: 50px;
            overscroll-behavior: none; /* Заборона "гумового" ефекту всієї сторінки */
        }

        /* ЗАВАНТАЖЕННЯ */
        .loader-wrap { padding: 20px; }
        .skeleton {
            background: linear-gradient(90deg, #e1e1e1 25%, #f1f1f1 50%, #e1e1e1 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 12px; margin-bottom: 12px;
        }
        .sk-h { height: 32px; width: 50%; margin-bottom: 20px; }
        .sk-row { height: 72px; width: 100%; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* ШАПКА */
        header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(255, 255, 255, 0.95); /* Менш прозорий фон для стабільності */
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding: 16px 20px;
        }
        @media (prefers-color-scheme: dark) { header { background: #1c1c1d; border-bottom: 1px solid #38383a; } }

        .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .app-name { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; color: #fff; text-transform: uppercase; }
        .badge.lite { background: var(--tg-hint); }
        .badge.pro { background: var(--pro-gradient); color: #000; }

        .search-box { position: relative; }
        .search-inp {
            width: 100%; padding: 12px 12px 12px 40px;
            border-radius: 12px; border: none;
            background: rgba(142, 142, 147, 0.12);
            font-size: 17px; color: var(--tg-text); box-sizing: border-box;
        }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); opacity: 0.5; }

        /* СПИСОК */
        .container { padding: 20px; }
        .cat-name { font-size: 13px; text-transform: uppercase; color: var(--tg-hint); font-weight: 600; margin: 24px 0 8px 8px; }
        
        .doc-card {
            background: var(--tg-bg); padding: 16px;
            border-radius: var(--radius-card);
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 10px; box-shadow: var(--shadow);
            cursor: pointer; transition: transform 0.1s;
        }
        .doc-card:active { transform: scale(0.98); }
        .doc-card.locked { opacity: 0.6; background: rgba(255,255,255,0.5); }
        
        .card-main { display: flex; align-items: center; gap: 12px; }
        .icon-box {
            width: 42px; height: 42px; border-radius: 10px;
            background: rgba(0, 122, 255, 0.1); color: var(--tg-btn);
            display: flex; align-items: center; justify-content: center; font-size: 20px;
        }
        .locked .icon-box { background: rgba(255, 165, 0, 0.1); color: orange; }
        .doc-title { font-size: 16px; font-weight: 600; line-height: 1.3; }
        .pro-tag { font-size: 10px; font-weight: 900; background: var(--pro-gradient); padding: 2px 5px; border-radius: 4px; margin-left: 6px; color: #000; vertical-align: middle; }

        /* МОДАЛКА (ШТОРКА) */
        .overlay {
            position: fixed; top:0; left:0; w:100%; h:100%; background: rgba(0,0,0,0.6);
            z-index: 200; opacity: 0; pointer-events: none; transition: 0.3s;
            backdrop-filter: blur(2px);
        }
        .overlay.visible { opacity: 1; pointer-events: auto; }

        .sheet {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--tg-bg); 
            border-radius: 20px 20px 0 0;
            padding: 0; /* Падінг прибираємо з контейнера, додаємо в body */
            box-sizing: border-box;
            transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 300; 
            max-height: 92vh; /* Майже на весь екран */
            height: auto;
            display: flex; flex-direction: column;
        }
        .sheet.visible { transform: translateY(0); }

        /* Заголовок шторки (Фіксований) */
        .sheet-head { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 20px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            background: var(--tg-bg);
            border-radius: 20px 20px 0 0;
        }
        .sheet-t { font-size: 20px; font-weight: 700; max-width: 85%; }
        .close-btn { 
            background: rgba(142,142,147,0.15); border: none; width: 32px; height: 32px; 
            border-radius: 50%; color: var(--tg-hint); font-size: 20px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        
        /* Тіло шторки (Скролиться) */
        .sheet-body { 
            overflow-y: auto; 
            padding: 20px; 
            overscroll-behavior: contain; /* Скрол не передається на body */
            -webkit-overflow-scrolling: touch;
        }

        /* ФОРМА */
        .inp-group { margin-bottom: 18px; transition: all 0.3s ease; }
        .inp-label { 
            display: block; font-size: 13px; font-weight: 600; color: var(--tg-hint); 
            margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        /* Червона зірочка */
        .required-mark { color: var(--error-color); margin-left: 3px; font-weight: bold; font-size: 14px; }
        
        .inp-field {
            width: 100%; padding: 14px; border-radius: var(--radius-input);
            border: 1px solid transparent; background: var(--tg-sec-bg); color: var(--tg-text);
            font-size: 16px; box-sizing: border-box; transition: 0.2s;
            -webkit-appearance: none;
        }
        .inp-field:focus { background: var(--tg-bg); border-color: var(--tg-btn); outline: none; box-shadow: 0 0 0 2px rgba(0,122,255,0.1); }
        .inp-field.error { border-color: var(--error-color); background: rgba(255, 59, 48, 0.05); }
        textarea.inp-field { min-height: 100px; resize: none; font-family: inherit; }

        /* CHECKBOX GROUP */
        .checkbox-row {
            display: flex; align-items: center; gap: 12px;
            padding: 16px; background: var(--tg-sec-bg); border-radius: var(--radius-input);
            cursor: pointer; margin-bottom: 16px;
            border: 1px solid transparent;
        }
        .checkbox-row.active { background: var(--tg-bg); border-color: var(--tg-btn); }
        .checkbox-row input { width: 22px; height: 22px; accent-color: var(--tg-btn); }
        .checkbox-label { font-size: 16px; font-weight: 600; flex: 1; }
        
        .nested-container {
            margin-left: 10px; padding-left: 14px; border-left: 3px solid rgba(0,122,255,0.3);
            display: none; opacity: 0; transition: opacity 0.3s; margin-bottom: 16px;
        }
        .nested-container.open { display: block; opacity: 1; }

        .btn { width: 100%; padding: 16px; border-radius: 14px; font-size: 17px; font-weight: 700; border: none; cursor: pointer; margin-top: 10px; color: #fff; }
        .btn-primary { background: var(--tg-btn); box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3); }
        .btn-pro { background: var(--pro-gradient); color: #000; box-shadow: 0 4px 15px rgba(255, 165, 0, 0.3); }

        /* PRO Screen */
        .pro-screen { text-align: center; padding: 40px 20px; }
        .lock-big { font-size: 64px; margin-bottom: 16px; display: inline-block; animation: shake 2s infinite; }
        @keyframes shake { 0%,100%{transform:rotate(0);} 25%{transform:rotate(-10deg);} 75%{transform:rotate(10deg);} }

    </style>
</head>
<body>

    <div id="loader" class="loader-wrap">
        <div class="skeleton sk-h"></div>
        <div class="skeleton sk-row"></div>
        <div class="skeleton sk-row"></div>
    </div>

    <div id="app" style="display: none;">
        <header>
            <div class="top-row">
                <div class="app-name">Justin AI</div>
                <div id="userBadge" class="badge lite">Lite</div>
            </div>
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="search" class="search-inp" placeholder="Пошук документа..." oninput="app.render()">
            </div>
        </header>

        <div id="list" class="container"></div>
    </div>

    <div id="overlay" class="overlay" onclick="app.close()"></div>

    <!-- FORM SHEET -->
    <div id="formSheet" class="sheet">
        <div class="sheet-head">
            <div id="formTitle" class="sheet-t">...</div>
            <button class="close-btn" onclick="app.close()">✕</button>
        </div>
        <div class="sheet-body">
            <div id="formFields"></div>
            <div style="height: 20px;"></div> <!-- Spacer -->
            <button class="btn btn-primary" onclick="app.submit()">Створити документ</button>
            <div style="height: 30px;"></div> <!-- Bottom padding -->
        </div>
    </div>

    <!-- PRO SHEET -->
    <div id="proSheet" class="sheet">
        <div class="sheet-head">
            <div class="sheet-t">Доступ закрито</div>
            <button class="close-btn" onclick="app.close()">✕</button>
        </div>
        <div class="sheet-body pro-screen">
            <div class="lock-big">🔒</div>
            <h3>Тільки для PRO</h3>
            <p style="color:var(--tg-hint); margin-bottom: 24px; font-size: 16px; line-height: 1.5;">
                Цей документ вимагає складного AI-аналізу.<br>
                Оформіть підписку для доступу.
            </p>
            <button class="btn btn-pro" onclick="app.buyPro()">Активувати PRO</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        // Вмикаємо підтвердження закриття, щоб випадково не свайпнули
        if (tg.enableClosingConfirmation) tg.enableClosingConfirmation();

        // 🔥 ВАШЕ ПОСИЛАННЯ (RAW JSON)
        const CONFIG_URL = "https://raw.githubusercontent.com/Normalnuy/justin-legal-tools/main/templates.json";

        const urlParams = new URLSearchParams(window.location.search);
        const IS_PRO = urlParams.get('plan') === 'pro';

        const app = {
            data: null,
            currentId: null,

            async init() {
                try {
                    const res = await fetch(CONFIG_URL);
                    if(!res.ok) throw new Error("JSON Error");
                    this.data = await res.json();
                    
                    document.getElementById('loader').style.display = 'none';
                    const appDiv = document.getElementById('app');
                    appDiv.style.display = 'block';
                    
                    appDiv.style.opacity = 0;
                    setTimeout(() => { 
                        appDiv.style.transition = 'opacity 0.4s'; 
                        appDiv.style.opacity = 1; 
                    }, 50);

                    if(IS_PRO) {
                        const b = document.getElementById('userBadge');
                        b.className = "badge pro"; b.innerText = "PRO";
                    }

                    this.render();
                } catch(e) {
                    document.getElementById('loader').innerHTML = `<div style="color:red; text-align:center;">Помилка завантаження:<br>${e.message}</div>`;
                }
            },

            render() {
                const search = document.getElementById('search').value.toLowerCase();
                const container = document.getElementById('list');
                container.innerHTML = '';

                const grouped = {};
                this.data.templates.forEach(t => {
                    if(search && !t.title.toLowerCase().includes(search)) return;
                    if(!grouped[t.cat]) grouped[t.cat] = [];
                    grouped[t.cat].push(t);
                });

                if(Object.keys(grouped).length === 0) {
                    container.innerHTML = `<div style="text-align:center; color:var(--tg-hint); margin-top:40px;">Нічого не знайдено 🤷‍♂️</div>`;
                    return;
                }

                for(const [catKey, items] of Object.entries(grouped)) {
                    const catTitle = document.createElement('div');
                    catTitle.className = 'cat-name';
                    catTitle.innerText = this.data.categories[catKey] || catKey;
                    container.appendChild(catTitle);

                    items.forEach(item => {
                        const isLocked = item.pro && !IS_PRO;
                        const el = document.createElement('div');
                        el.className = `doc-card ${isLocked ? 'locked' : ''}`;
                        el.onclick = () => this.click(item, isLocked);
                        
                        let icon = '📄';
                        if(catKey === 'civil') icon = '⚖️';
                        if(catKey === 'family') icon = '❤️';
                        if(isLocked) icon = '🔒';

                        const proBadge = item.pro ? `<span class="pro-tag">PRO</span>` : '';

                        el.innerHTML = `
                            <div class="card-main">
                                <div class="icon-box">${icon}</div>
                                <div class="doc-title">${item.title} ${proBadge}</div>
                            </div>
                            <div style="color:var(--tg-hint); opacity:0.5;">›</div>
                        `;
                        container.appendChild(el);
                    });
                }
            },

            click(item, isLocked) {
                tg.HapticFeedback.impactOccurred(isLocked ? 'error' : 'light');
                if(isLocked) {
                    this.sheet('proSheet');
                } else {
                    this.buildForm(item);
                    this.sheet('formSheet');
                }
            },

            renderField(f, container) {
                // 1. Checkbox (Group)
                if (f.type === 'checkbox') {
                    const groupDiv = document.createElement('div');
                    
                    const checkboxRow = document.createElement('div');
                    checkboxRow.className = 'checkbox-row';
                    const checkId = `check_${f.id}`;
                    
                    checkboxRow.innerHTML = `
                        <div class="checkbox-label">${f.label}</div>
                        <input type="checkbox" id="${checkId}">
                    `;
                    
                    const nestedDiv = document.createElement('div');
                    nestedDiv.className = 'nested-container';
                    nestedDiv.id = `nested_${f.id}`;

                    checkboxRow.onclick = (e) => {
                        const checkbox = document.getElementById(checkId);
                        if (e.target !== checkbox) checkbox.checked = !checkbox.checked;
                        
                        if (checkbox.checked) {
                            nestedDiv.classList.add('open');
                            checkboxRow.classList.add('active');
                        } else {
                            nestedDiv.classList.remove('open');
                            checkboxRow.classList.remove('active');
                        }
                    };

                    if (f.nested_fields) {
                        f.nested_fields.forEach(nf => this.renderField(nf, nestedDiv));
                    }

                    groupDiv.appendChild(checkboxRow);
                    groupDiv.appendChild(nestedDiv);
                    container.appendChild(groupDiv);
                    return;
                }

                // 2. Normal Inputs
                const wrap = document.createElement('div');
                wrap.className = 'inp-group';
                
                // 🔥 ЛОГІКА ЗІРОЧКИ
                const isRequired = f.required !== false; // За замовчуванням true
                const starHtml = isRequired ? '<span class="required-mark">*</span>' : ' <span style="color:var(--tg-hint);font-weight:400;font-size:12px;">(необов.)</span>';
                
                const lbl = document.createElement('label');
                lbl.className = 'inp-label';
                lbl.innerHTML = f.label + starHtml;
                wrap.appendChild(lbl);

                let inp;
                if(f.type === 'textarea') {
                    inp = document.createElement('textarea');
                } else if(f.type === 'date') {
                    inp = document.createElement('input');
                    inp.type = 'date';
                } else {
                    inp = document.createElement('input');
                    inp.type = 'text';
                }
                
                inp.className = 'inp-field';
                inp.id = `in_${f.id}`;
                inp.placeholder = f.placeholder || '';
                // Зберігаємо статус обов'язковості для валідації
                inp.dataset.required = isRequired ? "true" : "false";
                
                wrap.appendChild(inp);
                container.appendChild(wrap);
            },

            buildForm(item) {
                this.currentId = item.id;
                document.getElementById('formTitle').innerText = item.title;
                const container = document.getElementById('formFields');
                container.innerHTML = '';

                const fields = item.fields || [];
                if(fields.length === 0) {
                    container.innerHTML = `<div style="text-align:center; color:gray;">Полів немає.</div>`;
                    return;
                }

                fields.forEach(f => this.renderField(f, container));
            },

            sheet(id) {
                document.getElementById('overlay').classList.add('visible');
                document.getElementById(id).classList.add('visible');
            },

            close() {
                document.getElementById('overlay').classList.remove('visible');
                document.querySelectorAll('.sheet').forEach(el => el.classList.remove('visible'));
            },

            submit() {
                const inputs = {};
                let isValid = true;
                let firstError = null;

                document.querySelectorAll('#formFields .inp-field').forEach(el => {
                    // Перевіряємо видимість (батьківський елемент не має бути прихованим)
                    if (el.offsetParent === null) return; 

                    const val = el.value.trim();
                    const isRequired = el.dataset.required === "true";

                    if (isRequired && !val) {
                        isValid = false;
                        el.classList.add('error');
                        if(!firstError) firstError = el;
                        el.oninput = () => el.classList.remove('error');
                    }

                    if (val) {
                        inputs[el.id.replace('in_', '')] = val;
                    }
                });

                if (!isValid) {
                    tg.HapticFeedback.notificationOccurred('error');
                    // Скролимо до першої помилки
                    if(firstError) firstError.scrollIntoView({behavior: "smooth", block: "center"});
                    return;
                }

                tg.HapticFeedback.notificationOccurred('success');
                tg.sendData(JSON.stringify({
                    action: "doc_generate",
                    template_id: this.currentId,
                    inputs: inputs
                }));
            },

            buyPro() {
                tg.HapticFeedback.notificationOccurred('success');
                tg.sendData(JSON.stringify({action: "buy_pro"}));
                this.close();
            }
        };

        app.init();
    </script>
</body>
</html>
